<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Depression Tracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg site-nav"><div class="container"><a class="navbar-brand" href="{{ url_for('index') }}"><span class="brand-mark">+</span> AI Depression Tracker</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="nav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-3"><a class="nav-link" href="{{ url_for('index') }}">Home</a><a class="nav-link" href="{{ url_for('about') }}">About</a><a class="nav-link" href="{{ url_for('locator') }}">Find support</a>{% if current_user %}<a class="nav-link" href="{{ url_for('progress') }}">My progress</a><a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Log out</a>{% else %}<a class="nav-link" href="{{ url_for('login') }}">Log in</a><a class="btn btn-mint btn-sm" href="{{ url_for('register') }}">Create account</a>{% endif %}</div></div></div></nav>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer"><div class="container d-flex flex-wrap justify-content-between gap-3"><span>Allenhouse Institute of Technology</span><span>Screening support, not a diagnosis.</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static', filename='js/main.js') }}"></script>{% block scripts %}{% endblock %}
</body></html>
