{% extends 'base.html' %}{% block title %}Log in | AI Depression Tracker{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><p class="eyebrow teal">Welcome back</p><h1>Log in to continue</h1><p class="muted">Your progress is waiting for you.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label>Email address<input class="form-control mb-3" type="email" name="email" required></label><label>Password<input class="form-control mb-4" type="password" name="password" required></label><button class="btn btn-teal w-100">Log in →</button></form><p class="auth-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
